[package]
name = "lognook-desktop"
version = "0.1.0-beta.1"
edition = "2024"

[lib]
name = "lognook_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lognook-core = { path = "../../../crates/lognook-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1.0"
